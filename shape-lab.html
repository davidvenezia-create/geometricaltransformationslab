<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shape Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F8FB; --grid:#CFE0E9; --ink:#14233B; --ink-soft:#4B5D76;
  --blue:#2B59FF; --blue-soft:#DDE6FF;
  --pink:#E8388A; --pink-soft:#FFE1EF;
  --sun:#FFC533; --sun-soft:#FFF1C4;
  --mint:#12905F; --mint-soft:#D5F4E6;
  --white:#fff;
  --shadow:4px 4px 0 var(--ink);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:12px}
body{
  margin:0; font-family:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif; font-size:17px; line-height:1.5; color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
}
h1,h2,h3,.btn,.tab,.seg button,.tool{font-family:'Fredoka','Lexend',system-ui,sans-serif}
h1{font-size:2.1rem; line-height:1.1; margin:0; font-weight:700}
h2{font-size:1.45rem; margin:0 0 6px; font-weight:600}
h3{font-size:1.15rem; margin:14px 0 6px; font-weight:600}
p{margin:0 0 10px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.skip{position:absolute; left:-999px; top:8px; background:var(--sun); padding:8px 14px; border:2px solid var(--ink); border-radius:999px; z-index:10}
.skip:focus{left:12px}
:focus-visible{outline:3px solid var(--ink); outline-offset:3px; box-shadow:0 0 0 6px var(--sun)}

.top{max-width:1180px; margin:0 auto; padding:18px 20px 8px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:14px}
.logo{width:74px; height:auto}
.sub{margin:2px 0 0; color:var(--ink-soft); font-size:.98rem}
.seg{display:inline-flex; border:2px solid var(--ink); border-radius:999px; overflow:hidden; background:#fff; flex-wrap:wrap}
.seg button{border:0; background:transparent; padding:.45rem 1rem; font-size:1rem; font-weight:600; cursor:pointer; color:var(--ink)}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--sun)}

.who{max-width:1180px; margin:0 auto; padding:0 20px 8px; display:flex; gap:10px 18px; flex-wrap:wrap}
.who label{display:flex; align-items:center; gap:8px; font-weight:600}
.who input{font:inherit; border:2px solid var(--ink); border-radius:10px; padding:5px 10px; background:#fff; color:var(--ink); width:min(230px,42vw)}
.who input#gPeriod{width:90px}
.tabs{max-width:1180px; margin:6px auto 0; padding:0 20px; display:flex; gap:10px; flex-wrap:wrap}
.tab{border:2px solid var(--ink); background:#fff; border-radius:12px 12px 0 0; padding:.6rem 1.1rem; font-size:1.05rem; font-weight:600; cursor:pointer; color:var(--ink)}
.tab[aria-selected="true"]{background:var(--sun); transform:translateY(2px); padding-bottom:calc(.6rem + 2px)}
main{max-width:1180px; margin:0 auto; padding:0 20px 24px; border-top:0}
.station{padding-top:16px}

.lab{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr); gap:20px; align-items:start}
@media (max-width:920px){ .lab{grid-template-columns:1fr} h1{font-size:1.7rem} }
.side{display:grid; gap:18px}
.panel{background:#fff; border:2px solid var(--ink); border-radius:16px; box-shadow:var(--shadow); padding:16px 18px}
.stage{padding:14px}
canvas{display:block; width:100%; background:#fff; border:2px solid var(--ink); border-radius:8px; touch-action:none}
#labCanvas{aspect-ratio:1/1; cursor:grab}
#twinCanvas{aspect-ratio:4/3}
.row{display:flex; flex-wrap:wrap; gap:10px; margin-top:12px}
.btn{border:2px solid var(--ink); background:#fff; border-radius:999px; padding:.5rem 1.1rem; font-size:1.02rem; font-weight:600; cursor:pointer; box-shadow:2px 2px 0 var(--ink); color:var(--ink); transition:transform .08s, box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px); box-shadow:0 0 0 var(--ink)}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none; box-shadow:2px 2px 0 var(--ink)}
.btn.primary{background:var(--blue); color:#fff}
.btn.good{background:var(--mint); color:#fff}
.btn[aria-pressed="true"]{background:var(--sun)}
.lbl{font-weight:600; display:block; margin:0 0 6px}
.hint{color:var(--ink-soft); font-size:.92rem; margin:4px 0 0}
.es{font-style:italic}

.ctl{margin:12px 0}
.ctl label{display:flex; justify-content:space-between; font-weight:600; margin-bottom:2px}
.ctl output{font-family:'Fredoka',sans-serif; font-size:1.1rem; color:var(--blue)}
input[type=range]{width:100%; accent-color:var(--blue); height:28px}
.check{display:flex; gap:10px; align-items:flex-start; margin:10px 0 4px}
.check input{width:22px; height:22px; margin-top:2px; accent-color:var(--blue)}

.tools{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:8px}
.tool{border:2px solid var(--ink); background:#fff; border-radius:12px; padding:.55rem .3rem; cursor:pointer; text-align:center; color:var(--ink); display:flex; flex-direction:column; line-height:1.15}
.tool b{font-size:1.1rem; font-weight:600}
.tool small{font-family:'Lexend',sans-serif; font-size:.74rem; color:var(--ink-soft)}
.tool[aria-pressed="true"]{background:var(--blue); color:#fff}
.tool[aria-pressed="true"] small{color:#dfe7ff}
@media (max-width:420px){ .tools{grid-template-columns:repeat(2,1fr)} }
.mirrors{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.mirrors .btn{text-align:center; padding:.45rem .5rem}

table{width:100%; border-collapse:collapse; font-size:.95rem}
th,td{padding:5px 8px; text-align:left; border-bottom:1.5px solid var(--grid)}
th{font-weight:600}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
.tag-blue{color:var(--blue); font-weight:600}
.tag-pink{color:var(--pink); font-weight:600}

.verdict{transition:background .2s}
.verdict .big{font-family:'Fredoka',sans-serif; font-size:1.9rem; font-weight:700; line-height:1.1; margin:0 0 4px}
.v-congruent{background:var(--mint-soft)}
.v-similar{background:var(--sun-soft)}
.v-not{background:var(--pink-soft)}

.goals{list-style:none; padding:0; margin:8px 0 0; display:grid; gap:8px}
.goals li, .checklist li{display:flex; gap:10px; align-items:flex-start}
.checklist{list-style:none; padding:0; margin:8px 0 0; display:grid; gap:9px}
.ico{flex:none; width:26px; height:26px; border:2px solid var(--ink); border-radius:50%; background:#fff; display:grid; place-items:center}
.done .ico{background:var(--mint); border-color:var(--mint)}
.ico svg{width:16px; height:16px; opacity:0}
.done .ico svg{opacity:1}

.rule{background:var(--blue-soft); border:2px solid var(--ink); border-radius:12px; padding:10px 12px; margin:8px 0}
.rule .alg{font-family:'Fredoka',sans-serif; font-size:1.25rem; font-weight:600}
.status{margin:8px 0 0; font-weight:500}
.ok-msg{color:var(--mint); font-weight:600}
.bad-msg{color:var(--pink); font-weight:600}

.chips{display:flex; gap:8px; flex-wrap:wrap; margin:8px 0}
.chip{border:2px solid var(--ink); border-radius:999px; min-width:38px; height:38px; padding:0 12px; background:#fff; font-family:'Fredoka',sans-serif; font-weight:600; cursor:pointer; color:var(--ink)}
.chip[aria-current="true"]{background:var(--sun)}
.chip.done{background:var(--mint); color:#fff; border-color:var(--ink)}

/* sort */
.pair{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:12px 0}
.fig{border:2px solid var(--ink); border-radius:12px; background:#fff; padding:6px}
.fig svg{display:block; width:100%; height:auto}
.answers{display:flex; gap:10px; flex-wrap:wrap}
.answers .btn{font-size:1.15rem; padding:.6rem 1.4rem}
.answers .btn.wrong{background:var(--pink-soft)}
.answers .btn.right{background:var(--mint); color:#fff}
.meter{height:12px; border:2px solid var(--ink); border-radius:999px; background:#fff; overflow:hidden; margin:6px 0 2px}
.meter i{display:block; height:100%; background:var(--blue)}
@media (max-width:560px){ .pair{grid-template-columns:1fr} }

/* recap */
.ideas{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:16px; margin-top:10px}
.idea{border:2px solid var(--ink); border-radius:14px; padding:12px 14px; background:#fff}
.idea:nth-child(1){border-top:10px solid var(--blue)}
.idea:nth-child(2){border-top:10px solid var(--pink)}
.idea:nth-child(3){border-top:10px solid var(--sun)}
.idea:nth-child(4){border-top:10px solid var(--mint)}
.idea svg{width:100%; height:auto; background:var(--paper); border-radius:8px; margin-bottom:6px}
.idea h3{margin:4px 0 2px}
.idea dl{margin:0; font-size:.93rem}
.idea dt{font-weight:600; margin-top:6px}
.idea dd{margin:0}
.snaps{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; margin-top:8px}
.snap{border:2px solid var(--ink); border-radius:12px; padding:8px; background:#fff}
.snap img{width:100%; display:block; border-radius:6px; border:1.5px solid var(--grid)}
.snap input{width:100%; margin-top:6px; font:inherit; font-size:.9rem; padding:6px 8px; border:2px solid var(--ink); border-radius:8px}
.snap button{margin-top:6px; font-size:.85rem; padding:.25rem .8rem}
.wrap{display:grid; gap:18px; margin-top:16px}
.frame{margin:12px 0 2px; font-size:1.05rem}
.frame input[type=text], .frame textarea, .frame select, .name input, textarea.free{font:inherit; border:2px solid var(--ink); border-radius:10px; padding:7px 10px; background:#fff; color:var(--ink)}
.frame input[type=text]{width:100%; margin-top:4px}
.frame textarea, textarea.free{width:100%; margin-top:4px; resize:vertical}
.frame select{margin:0 6px; min-width:140px}
.frame select.ok{background:var(--mint-soft); border-color:var(--mint)}
.frame select.bad{background:var(--pink-soft); border-color:var(--pink)}
.name{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:6px 0 12px}
.name input{width:min(320px,100%)}
.vocab{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0}
.vocab span{border:2px solid var(--grid); color:var(--ink-soft); border-radius:999px; padding:1px 10px; font-size:.9rem}
.vocab span.on{border-color:var(--mint); background:var(--mint-soft); color:var(--ink); font-weight:600}
.bank{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0}
.bank span{background:var(--sun-soft); border:2px solid var(--ink); border-radius:10px; padding:2px 10px; font-size:.95rem}
.bank small{color:var(--ink-soft)}

.wall{max-width:1180px; margin:0 auto 40px; padding:0 20px}
.wall summary{cursor:pointer; font-family:'Fredoka',sans-serif; font-size:1.25rem; font-weight:600; padding:12px 18px; background:#fff; border:2px solid var(--ink); border-radius:14px; box-shadow:var(--shadow); list-style:none}
.wall summary::-webkit-details-marker{display:none}
.wall[open] summary{border-radius:14px 14px 0 0; box-shadow:none}
.wall .body{background:#fff; border:2px solid var(--ink); border-top:0; border-radius:0 0 14px 14px; padding:8px 18px 16px; box-shadow:var(--shadow)}
.wall dl{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:4px 26px; margin:0}
.wall dt{font-weight:600; margin-top:10px}
.wall dt em{font-weight:400; color:var(--pink)}
.wall dd{margin:0; font-size:.93rem}

#toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px; font-weight:500; opacity:0; pointer-events:none; transition:opacity .2s; z-index:20; max-width:90vw}
#toast.show{opacity:1}

#printSheet{display:none}
@media print{
  body{background:#fff; font-size:12pt}
  body>*:not(#printSheet){display:none!important}
  #printSheet{display:block!important}
  #printSheet h1{font-size:20pt}
  #printSheet .ps-snaps{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0}
  #printSheet .ps-snaps img{width:100%; border:1px solid #999}
  #printSheet p{white-space:pre-wrap}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important; animation:none!important} }
</style>
</head>
<body>
<a class="skip" href="#main" data-i18n="skip">Skip to content</a>

<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 68 44" aria-hidden="true">
      <polygon points="4,40 31,40 4,6" fill="#DDE6FF" stroke="#2B59FF" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="64,40 37,40 64,6" fill="#FFE1EF" stroke="#E8388A" stroke-width="3" stroke-linejoin="round"/>
      <line x1="34" y1="2" x2="34" y2="42" stroke="#14233B" stroke-width="2" stroke-dasharray="3 3"/>
    </svg>
    <div>
      <h1 data-i18n="app.title">Shape Lab</h1>
      <p class="sub" data-i18n="app.sub"></p>
    </div>
  </div>
  <div class="seg" role="group" aria-label="Language / Idioma" id="langSeg">
    <button type="button" data-lang="en" aria-pressed="true">English</button>
    <button type="button" data-lang="es" aria-pressed="false">Español</button>
  </div>
</header>

<div class="who">
  <label><span data-i18n="who.name"></span><input type="text" id="gName" autocomplete="off"></label>
  <label><span data-i18n="who.period"></span><input type="text" id="gPeriod" autocomplete="off" inputmode="numeric" maxlength="6"></label>
</div>

<nav class="tabs" role="tablist" id="tabs">
  <button class="tab" role="tab" id="t-twins" aria-controls="tab-twins" aria-selected="true" data-tab="twins" data-i18n="tab.twins"></button>
  <button class="tab" role="tab" id="t-move" aria-controls="tab-move" aria-selected="false" tabindex="-1" data-tab="move" data-i18n="tab.move"></button>
  <button class="tab" role="tab" id="t-sort" aria-controls="tab-sort" aria-selected="false" tabindex="-1" data-tab="sort" data-i18n="tab.sort"></button>
  <button class="tab" role="tab" id="t-recap" aria-controls="tab-recap" aria-selected="false" tabindex="-1" data-tab="recap" data-i18n="tab.recap"></button>
</nav>

<main id="main">

<!-- ========== TWINS ========== -->
<section class="station" id="tab-twins" role="tabpanel" aria-labelledby="t-twins">
  <div class="lab">
    <div class="panel stage">
      <canvas id="twinCanvas" role="img" data-i18n-aria="twins.alt"></canvas>
      <div class="row">
        <button class="btn" id="twinSnap" data-i18n="btn.snap"></button>
        <button class="btn" id="twinReset" data-i18n="twins.reset"></button>
      </div>
    </div>
    <div class="side">
      <div class="panel">
        <h2 data-i18n="twins.h"></h2>
        <p data-i18n="twins.p"></p>
        <div class="ctl"><label for="sx"><span data-i18n="twins.width"></span><output id="sxOut"></output></label>
          <input type="range" id="sx" min="0.5" max="2" step="0.25" value="1"></div>
        <div class="ctl"><label for="sy"><span data-i18n="twins.height"></span><output id="syOut"></output></label>
          <input type="range" id="sy" min="0.5" max="2" step="0.25" value="1"></div>
        <label class="check"><input type="checkbox" id="lock" checked><span data-i18n="twins.lock"></span></label>
        <div class="ctl"><label for="ang"><span data-i18n="twins.turn"></span><output id="angOut"></output></label>
          <input type="range" id="ang" min="0" max="345" step="15" value="0"></div>
        <button class="btn" id="flipBtn" aria-pressed="false" data-i18n="twins.flip"></button>
      </div>
      <div class="panel verdict v-congruent" id="verdict" aria-live="polite">
        <p class="big" id="vBig"></p>
        <p id="vWhy" style="margin:0"></p>
      </div>
      <div class="panel">
        <h3 style="margin-top:0" data-i18n="twins.measure"></h3>
        <table>
          <caption class="sr" data-i18n="twins.measure"></caption>
          <thead><tr><th data-i18n="th.part"></th><th class="num tag-blue" data-i18n="th.blue"></th><th class="num tag-pink" data-i18n="th.pink"></th><th class="num" data-i18n="th.ratio"></th></tr></thead>
          <tbody id="twinTable"></tbody>
        </table>
        <h3 data-i18n="goals.h"></h3>
        <ul class="goals" id="twinGoals"></ul>
      </div>
    </div>
  </div>
</section>

<!-- ========== MOVE ========== -->
<section class="station" id="tab-move" role="tabpanel" aria-labelledby="t-move" hidden>
  <div class="lab">
    <div class="panel stage">
      <canvas id="labCanvas" role="img" data-i18n-aria="move.alt"></canvas>
      <div class="row">
        <button class="btn primary" id="btnAnother" data-i18n="btn.another"></button>
        <button class="btn" id="btnUndo" data-i18n="btn.undo"></button>
        <button class="btn" id="btnRestart" data-i18n="btn.restart"></button>
        <button class="btn" id="labSnap" data-i18n="btn.snap"></button>
      </div>
      <p class="hint" id="dragHint" data-i18n="move.dragHint"></p>
    </div>
    <div class="side">
      <div class="panel">
        <div class="seg" id="modeSeg" role="group">
          <button type="button" data-mode="free" aria-pressed="true" data-i18n="move.free"></button>
          <button type="button" data-mode="missions" aria-pressed="false" data-i18n="move.missions"></button>
        </div>
        <div id="freeBox" style="margin-top:12px">
          <span class="lbl" data-i18n="move.shape"></span>
          <div class="seg" id="shapeSeg" role="group">
            <button type="button" data-shape="triangle" aria-pressed="true" data-i18n="shape.triangle"></button>
            <button type="button" data-shape="l" aria-pressed="false" data-i18n="shape.l"></button>
            <button type="button" data-shape="flag" aria-pressed="false" data-i18n="shape.flag"></button>
          </div>
        </div>
        <div id="missionBox" style="margin-top:12px" hidden>
          <h2 id="mTitle"></h2>
          <div class="chips" id="mChips"></div>
          <p id="mTask"></p>
          <div class="row" style="margin-top:0">
            <button class="btn good" id="mCheck" data-i18n="mission.check"></button>
            <button class="btn" id="mHint" data-i18n="mission.hint"></button>
            <button class="btn" id="mNext" data-i18n="mission.next" hidden></button>
          </div>
          <p class="hint" id="mHintText" hidden></p>
          <p class="status" id="mResult" role="status"></p>
        </div>
      </div>
      <div class="panel">
        <div class="tools" id="toolSeg" role="group">
          <button type="button" class="tool" data-tool="slide" aria-pressed="true"><b data-i18n="tool.slide"></b><small data-i18n="tool.slide.t"></small></button>
          <button type="button" class="tool" data-tool="flip" aria-pressed="false"><b data-i18n="tool.flip"></b><small data-i18n="tool.flip.t"></small></button>
          <button type="button" class="tool" data-tool="turn" aria-pressed="false"><b data-i18n="tool.turn"></b><small data-i18n="tool.turn.t"></small></button>
          <button type="button" class="tool" data-tool="resize" aria-pressed="false"><b data-i18n="tool.resize"></b><small data-i18n="tool.resize.t"></small></button>
        </div>

        <div class="toolctl" data-for="slide">
          <div class="ctl"><label for="dx"><span data-i18n="ctl.dx"></span><output id="dxOut"></output></label>
            <input type="range" id="dx" min="-12" max="12" step="1" value="0"></div>
          <div class="ctl"><label for="dy"><span data-i18n="ctl.dy"></span><output id="dyOut"></output></label>
            <input type="range" id="dy" min="-12" max="12" step="1" value="0"></div>
        </div>

        <div class="toolctl" data-for="flip" hidden>
          <span class="lbl" data-i18n="ctl.mirror"></span>
          <div class="mirrors" id="mirrorBtns">
            <button type="button" class="btn" data-m="x" aria-pressed="false" data-i18n="mirror.x"></button>
            <button type="button" class="btn" data-m="y" aria-pressed="false" data-i18n="mirror.y"></button>
            <button type="button" class="btn" data-m="d1" aria-pressed="false" data-i18n="mirror.d1"></button>
            <button type="button" class="btn" data-m="d2" aria-pressed="false" data-i18n="mirror.d2"></button>
          </div>
        </div>

        <div class="toolctl" data-for="turn" hidden>
          <div class="ctl"><label for="angle"><span data-i18n="ctl.angle"></span><output id="angleOut"></output></label>
            <input type="range" id="angle" min="-360" max="360" step="5" value="0"></div>
          <div class="row" style="margin-top:0">
            <button type="button" class="btn" data-q="90">90°</button>
            <button type="button" class="btn" data-q="180">180°</button>
            <button type="button" class="btn" data-q="270">270°</button>
            <button type="button" class="btn" data-q="-90">&minus;90°</button>
          </div>
          <p class="hint" data-i18n="ctl.angleNote"></p>
        </div>

        <div class="toolctl" data-for="resize" hidden>
          <div class="ctl"><label for="scale"><span data-i18n="ctl.scale"></span><output id="scaleOut"></output></label>
            <input type="range" id="scale" min="0.25" max="3" step="0.25" value="1"></div>
          <div class="row" style="margin-top:0">
            <button type="button" class="btn" data-k="0.5">&times;0.5</button>
            <button type="button" class="btn" data-k="2">&times;2</button>

/* ============================================================
   Shared canvas helpers
   ============================================================ */
function prep(cv){
  const r = cv.getBoundingClientRect();
  if (r.width < 10) return null;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = Math.round(r.width*dpr), H = Math.round(r.height*dpr);
  if (cv.width !== W || cv.height !== H){ cv.width = W; cv.height = H; }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,r.width,r.height);
  return {ctx, w:r.width, h:r.height};
}
function polyPath(ctx, pts, X, Y){
  ctx.beginPath();
  pts.forEach((p,i) => i ? ctx.lineTo(X(p[0]),Y(p[1])) : ctx.moveTo(X(p[0]),Y(p[1])));
  ctx.closePath();
}
function tag(ctx, text, x, y, color, size=15, align='center'){
  ctx.font = `600 ${size}px Lexend, system-ui, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = 5; ctx.strokeStyle = '#fff';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color; ctx.fillText(text, x, y);
}
function drawShape(ctx, pts, X, Y, color, fillAlpha, labels, prime, dashed){
  ctx.save();
  polyPath(ctx, pts, X, Y);
  ctx.globalAlpha = fillAlpha; ctx.fillStyle = color; ctx.fill();
  ctx.globalAlpha = 1; ctx.lineWidth = 3; ctx.strokeStyle = color; ctx.lineJoin = 'round';
  if (dashed) ctx.setLineDash([8,6]);
  ctx.stroke(); ctx.setLineDash([]);
  if (labels){
    const c = cen(pts.map(p => [X(p[0]), Y(p[1])]));
    pts.forEach((p,i) => {
      const px = X(p[0]), py = Y(p[1]);
      ctx.beginPath(); ctx.arc(px,py,4.5,0,Math.PI*2); ctx.fillStyle = color; ctx.fill();
      let dx = px-c[0], dy = py-c[1]; const m = Math.hypot(dx,dy)||1;
      tag(ctx, 'ABCDEFGH'[i] + (prime ? '\u2032' : ''), px+dx/m*17, py+dy/m*17, color, 15);
    });
  }
  ctx.restore();
}
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('show'), 2600);
}

   ============================================================ */
const TRI = [[0,0],[4,0],[0,3]];
const TRI_SIDES = [4,5,3];
const twin = {sx:1, sy:1, angle:0, flip:false, lock:true, touched:false};
const OR_C = [5.5, 8.25], TW_C = [15.5, 8.25];

function origPts(){ const c = cen(TRI); return TRI.map(p => [p[0]-c[0]+OR_C[0], p[1]-c[1]+OR_C[1]]); }
function twinPts(){
  const c = cen(TRI), a = rad(twin.angle), cs = Math.cos(a), sn = Math.sin(a);
  return TRI.map(([x,y]) => {
    let rx = x-c[0], ry = y-c[1];
    if (twin.flip) rx = -rx;
    rx *= twin.sx; ry *= twin.sy;
    return [rx*cs - ry*sn + TW_C[0], rx*sn + ry*cs + TW_C[1]];
  });
}
const sidesOf = p => [dist(p[0],p[1]), dist(p[1],p[2]), dist(p[2],p[0])];
function anglesOf(p){
  return p.map((q,i) => {
    const a = p[(i+2)%3], b = p[(i+1)%3];
    const v1 = [a[0]-q[0], a[1]-q[1]], v2 = [b[0]-q[0], b[1]-q[1]];
    const cos = (v1[0]*v2[0]+v1[1]*v2[1]) / (Math.hypot(...v1)*Math.hypot(...v2));
    return Math.acos(Math.max(-1,Math.min(1,cos))) * 180/Math.PI;
  });
}
function twinVerdict(){
  const pts = twinPts(), s = sidesOf(pts), r = s.map((v,i) => v/TRI_SIDES[i]);
  const eps = 0.02;
  if (Math.max(...r) - Math.min(...r) > eps) return {kind:'not', pts, s, r};
  if (Math.abs(r[0]-1) < eps) return {kind:'congruent', pts, s, r, k:1};
  return {kind:'similar', pts, s, r, k:r[0]};
}
function drawTwins(){
  const P = prep($('#twinCanvas')); if (!P) return;
  const {ctx,w,h} = P, WW = 22, HH = 16.5;
  const X = x => x/WW*w, Y = y => h - y/HH*h;
  ctx.strokeStyle = COL.grid; ctx.lineWidth = 1;
  for (let x=0;x<=WW;x++){ ctx.beginPath(); ctx.moveTo(X(x),0); ctx.lineTo(X(x),h); ctx.stroke(); }
  for (let y=0;y<=HH;y+=1){ ctx.beginPath(); ctx.moveTo(0,Y(y)); ctx.lineTo(w,Y(y)); ctx.stroke(); }
  ctx.setLineDash([6,6]); ctx.strokeStyle = '#9db4c2'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(X(11),0); ctx.lineTo(X(11),h); ctx.stroke(); ctx.setLineDash([]);
  const o = origPts(), v = twinVerdict();
  drawShape(ctx, o, X, Y, COL.blue, .16, true, false);
  drawShape(ctx, v.pts, X, Y, COL.pink, .16, true, true);
  const lab = (pts, sides, color) => {
    const c = cen(pts);
    pts.forEach((p,i) => {
      const q = pts[(i+1)%3], mx = (p[0]+q[0])/2, my = (p[1]+q[1])/2;
      let dx = mx-c[0], dy = my-c[1]; const m = Math.hypot(dx,dy)||1;
      tag(ctx, fmt(sides[i],1), X(mx+dx/m*0.9), Y(my+dy/m*0.9), color, 14);
    });
  };
  lab(o, TRI_SIDES, COL.blue); lab(v.pts, v.s, COL.pink);
  tag(ctx, t('twins.blue'), X(5.5), 18, COL.blue, 14);
  tag(ctx, t('twins.pink'), X(16.5), 18, COL.pink, 14);
  updateTwinPanel(v);
}
function updateTwinPanel(v){
  $('#sxOut').textContent = '\u00D7' + fmt(twin.sx); $('#syOut').textContent = '\u00D7' + fmt(twin.sy);
  $('#angOut').textContent = twin.angle + '\u00B0';
  $('#flipBtn').setAttribute('aria-pressed', twin.flip);
  const box = $('#verdict'); box.className = 'panel verdict v-' + v.kind;
  $('#vBig').textContent = t('v.' + v.kind);
  $('#vWhy').textContent = t('v.why.' + v.kind, {k: v.k ? '\u00D7' + fmt(v.k) : ''});
  const oa = anglesOf(origPts()), ta = anglesOf(v.pts);
  let rows = '';
  [0,1,2].forEach(i => rows += `<tr><td>${esc(t('side',{n:'AB BC CA'.split(' ')[i]}))}</td><td class="num">${fmt(TRI_SIDES[i],1)}</td><td class="num">${fmt(v.s[i],1)}</td><td class="num">\u00D7${fmt(v.r[i])}</td></tr>`);
  [0,1,2].forEach(i => rows += `<tr><td>${esc(t('angle',{n:'ABC'[i]}))}</td><td class="num">${fmt(oa[i],1)}\u00B0</td><td class="num">${fmt(ta[i],1)}\u00B0</td><td class="num"></td></tr>`);
  $('#twinTable').innerHTML = rows;
  if (twin.touched){
    const before = [progress.twinC, progress.twinS, progress.twinN];
    if (v.kind === 'congruent' && (twin.flip || twin.angle % 360 !== 0)) progress.twinC = true;
    if (v.kind === 'similar' && Math.abs(v.k - 2) < 0.01) progress.twinS = true;
    if (v.kind === 'not') progress.twinN = true;
    [progress.twinC, progress.twinS, progress.twinN].forEach((now,i) => { if (now && !before[i]) logEvent({event:'goal', station:'twins', stageIndex:i+1, correct:true}); });
  }
  $('#twinGoals').innerHTML = [[progress.twinC,'goal.c'],[progress.twinS,'goal.s'],[progress.twinN,'goal.n']]
    .map(([d,k]) => checkItem(d, t(k))).join('');
}
const CHECK_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function checkItem(done, text){
  return `<li class="${done?'done':''}"><span class="ico">${CHECK_SVG}</span><span>${esc(text)}<span class="sr"> (${done ? 'done' : 'not yet'})</span></span></li>`;
}
function bindTwins(){
  const touch = () => { twin.touched = true; drawTwins(); };
  $('#sx').addEventListener('input', e => { twin.sx = +e.target.value; if (twin.lock){ twin.sy = twin.sx; $('#sy').value = twin.sy; } touch(); });
  $('#sy').addEventListener('input', e => { twin.sy = +e.target.value; if (twin.lock){ twin.sx = twin.sy; $('#sx').value = twin.sx; } touch(); });
  $('#lock').addEventListener('change', e => { twin.lock = e.target.checked; if (twin.lock){ twin.sy = twin.sx; $('#sy').value = twin.sy; } touch(); });
  $('#ang').addEventListener('input', e => { twin.angle = +e.target.value; touch(); });
  $('#flipBtn').addEventListener('click', () => { twin.flip = !twin.flip; touch(); });
  $('#twinReset').addEventListener('click', () => {
    Object.assign(twin, {sx:1, sy:1, angle:0, flip:false, lock:true});
    $('#sx').value = 1; $('#sy').value = 1; $('#ang').value = 0; $('#lock').checked = true; drawTwins();
  });
  $('#twinSnap').addEventListener('click', () => {
    const v = twinVerdict();
    addSnap($('#twinCanvas'), t('v.' + v.kind) + (v.kind === 'similar' ? ' (\u00D7' + fmt(v.k) + ')' : ''));
  });
}

/* ============================================================
   STATION 2: Move lab
   ============================================================ */
const SHAPES = {
  triangle: [[1,1],[4,1],[1,3]],
  l: [[1,1],[4,1],[4,2],[2,2],[2,4],[1,4]],
  flag: [[1,1],[1,5],[4,4],[2,3.2],[2,1]],
};
const cp = pts => pts.map(p => p.slice());
const MISSIONS = [
  {tool:'slide',  start:[[-6,1],[-3,1],[-6,3]], move: p => p.map(([x,y]) => [x+7, y+2])},
  {tool:'flip',   start:SHAPES.l,              move: p => p.map(([x,y]) => [-x, y])},
  {tool:'turn',   start:SHAPES.flag,           move: p => p.map(([x,y]) => [-y, x])},
  {tool:'resize', start:[[1,1],[3,1],[1,3]],   move: p => p.map(([x,y]) => [2*x, 2*y])},
  {tool:'flip',   start:[[-5,1],[-2,1],[-2,2],[-4,2],[-4,4],[-5,4]], move: p => p.map(([x,y]) => [x+7, -y])},
];
const lab = {
  mode:'free', shapeKey:'triangle', base:cp(SHAPES.triangle), start:cp(SHAPES.triangle), history:[],
  tool:'slide', p:null, m:0, target:null, hintOn:false, result:null,
};
function freshP(center){ return {dx:0, dy:0, mirror:null, reflT:1, angle:0, scale:1, center: center || 'origin'}; }
lab.p = freshP();

const anim = {}; let raf = 0;
function animateTo(key, to, ms=600){
  if (reduceMotion){ lab.p[key] = to; delete anim[key]; drawLab(); return; }
  anim[key] = {from:lab.p[key], to, t0:performance.now(), ms};
  if (!raf) raf = requestAnimationFrame(step);
}
function step(now){
  raf = 0; let active = false;
  for (const k in anim){
    const a = anim[k], u = Math.min(1, (now-a.t0)/a.ms);
    const e = u < .5 ? 2*u*u : 1 - Math.pow(-2*u+2,2)/2;
    lab.p[k] = a.from + (a.to-a.from)*e;
    if (u >= 1){ lab.p[k] = a.to; delete anim[k]; } else active = true;
  }
  drawLab();
  if (active) raf = requestAnimationFrame(step);
}
function settle(){ for (const k in anim){ lab.p[k] = anim[k].to; delete anim[k]; } }
function finalP(){ const p = Object.assign({}, lab.p); for (const k in anim) p[k] = anim[k].to; return p; }

const reflectPt = ([x,y], m) => m==='x' ? [x,-y] : m==='y' ? [-x,y] : m==='d1' ? [y,x] : [-y,-x];
function imagePts(base, tool, p){
  const c = p.center === 'a' ? base[0] : [0,0];
  switch(tool){
    case 'slide': return base.map(([x,y]) => [x+p.dx, y+p.dy]);
    case 'flip':
      if (!p.mirror) return cp(base);
      return base.map(q => { const r = reflectPt(q, p.mirror); return [q[0]+(r[0]-q[0])*p.reflT, q[1]+(r[1]-q[1])*p.reflT]; });
    case 'turn': {
      const a = rad(p.angle), cs = Math.cos(a), sn = Math.sin(a);
      return base.map(([x,y]) => { const dx = x-c[0], dy = y-c[1]; return [c[0]+dx*cs-dy*sn, c[1]+dx*sn+dy*cs]; });
    }
    case 'resize': return base.map(([x,y]) => [c[0]+(x-c[0])*p.scale, c[1]+(y-c[1])*p.scale]);
  }
  return cp(base);
}
function isIdentity(tool, p){
  if (tool==='slide') return p.dx===0 && p.dy===0;
  if (tool==='flip') return !p.mirror;
  if (tool==='turn') return Math.abs(p.angle % 360) < 1e-9;
  return Math.abs(p.scale-1) < 1e-9;
}
const changed = (a,b) => a.some((q,i) => Math.abs(q[0]-b[i][0])>1e-6 || Math.abs(q[1]-b[i][1])>1e-6);

function drawLab(){
  const P = prep($('#labCanvas')); if (!P) return;
  const {ctx,w,h} = P, R = 10;
  const X = x => (x+R)/(2*R)*w, Y = y => h - (y+R)/(2*R)*h;
  ctx.lineWidth = 1; ctx.strokeStyle = COL.grid;
  for (let i=-R;i<=R;i++){
    ctx.beginPath(); ctx.moveTo(X(i),0); ctx.lineTo(X(i),h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,Y(i)); ctx.lineTo(w,Y(i)); ctx.stroke();
  }
  ctx.strokeStyle = COL.ink; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,Y(0)); ctx.lineTo(w,Y(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(X(0),0); ctx.lineTo(X(0),h); ctx.stroke();
  ctx.font = '500 11px Lexend, sans-serif'; ctx.fillStyle = '#5b6d84'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let i=-R+2;i<R;i+=2){ if (i===0) continue; ctx.fillText(String(i).replace('-',MINUS), X(i), Y(0)+4); }
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let i=-R+2;i<R;i+=2){ if (i===0) continue; ctx.fillText(String(i).replace('-',MINUS), X(0)-5, Y(i)); }
  ctx.textAlign='left'; ctx.fillText('x', w-12, Y(0)-10); ctx.fillText('y', X(0)+8, 10);

  const cur = imagePts(lab.base, lab.tool, lab.p);
  const showImg = changed(lab.base, cur);

  if (lab.mode === 'missions' && lab.target){
    drawShape(ctx, lab.target, X, Y, COL.mint, .2, false, false, true);
    const c = cen(lab.target);
    tag(ctx, t('mission.target'), X(c[0]), Y(c[1]), COL.mint, 14);
  }
  if (lab.tool === 'flip' && lab.p.mirror){
    const m = lab.p.mirror; ctx.save(); ctx.setLineDash([9,7]); ctx.lineWidth = 2.5; ctx.strokeStyle = '#c98a00';
    ctx.beginPath();
    if (m==='x'){ ctx.moveTo(0,Y(0)); ctx.lineTo(w,Y(0)); }
    else if (m==='y'){ ctx.moveTo(X(0),0); ctx.lineTo(X(0),h); }
    else if (m==='d1'){ ctx.moveTo(X(-R),Y(-R)); ctx.lineTo(X(R),Y(R)); }
    else { ctx.moveTo(X(-R),Y(R)); ctx.lineTo(X(R),Y(-R)); }
    ctx.stroke(); ctx.restore();
  }
  if (showImg){
    ctx.save(); ctx.setLineDash([2,5]); ctx.strokeStyle = 'rgba(20,35,59,.4)'; ctx.lineWidth = 1.5;
    lab.base.forEach((q,i) => { ctx.beginPath(); ctx.moveTo(X(q[0]),Y(q[1])); ctx.lineTo(X(cur[i][0]),Y(cur[i][1])); ctx.stroke(); });
    ctx.restore();
  }
  drawShape(ctx, lab.base, X, Y, COL.blue, .16, true, false);
  if (showImg) drawShape(ctx, cur, X, Y, COL.pink, .16, true, true);
  if (lab.tool === 'turn' || lab.tool === 'resize'){
    const c = lab.p.center === 'a' ? lab.base[0] : [0,0];
    ctx.save(); ctx.strokeStyle = COL.ink; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(X(c[0]),Y(c[1]),8,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X(c[0])-12,Y(c[1])); ctx.lineTo(X(c[0])+12,Y(c[1])); ctx.moveTo(X(c[0]),Y(c[1])-12); ctx.lineTo(X(c[0]),Y(c[1])+12); ctx.stroke();
    ctx.restore();
  }
  updateLabPanel();
}

function ruleFor(fp){
  const tool = lab.tool, idn = isIdentity(tool, fp);
  const cName = t('center.' + fp.center + '.s');
  if (idn) return {alg:'(x, y) \u2192 (x, y)', words:t('words.none')};
  if (tool === 'slide'){
    const part = (v, s) => v === 0 ? s : s + ' ' + (v>0 ? '+' : MINUS) + ' ' + Math.abs(v);

function mini(base, img, mirror){

  $('#levelSeg').innerHTML = [1,2,3,4].map(n => `<button type="button" data-l="${n}" aria-pressed="${writing.level===n}">${esc(t('lvl'+n))}</button>`).join('');
  $$('#levelSeg button').forEach(b => b.addEventListener('click', () => { writing.level = +b.dataset.l; saveW(); renderLevels(); renderWrite(); }));
}
function renderWrite(){
  const A = $('#writeArea'), lv = writing.level; let h = `<p style="margin-top:12px">${esc(t('l'+lv+'.p'))}</p>`;
  if (lv === 1){
    h += `<div class="bank">${Object.keys(WORDS).map(k => `<span>${esc(WORDS[k][0])} <small>${esc(WORDS[k][1])}</small></span>`).join('')}</div>`;
    L1.forEach((s,i) => {
      h += `<div class="frame">${esc(s.pre)}<select data-i="${i}" aria-label="${i+1}"><option value="">${esc(t('write.choose'))}</option>${Object.keys(WORDS).map(k => `<option value="${k}">${esc(WORDS[k][0])}</option>`).join('')}</select>${esc(s.post)}${esHint(s.es)}</div>`;
    });
    h += `<div class="row"><button class="btn good" id="l1Check">${esc(t('write.check'))}</button></div><p class="status" id="l1Res" role="status"></p>`;
  } else if (lv === 2 || lv === 3){
    const arr = lv === 2 ? L2 : L3;
    arr.forEach((f,i) => {
      h += `<div class="frame"><label for="f${i}"><b>${esc(f[0])}</b></label>${esHint(f[1])}${lv===2 ? `<input type="text" id="f${i}" data-i="${i}" autocomplete="off">` : `<textarea id="f${i}" data-i="${i}" rows="2"></textarea>`}</div>`;
    });
  } else {
    h += `<textarea class="free" id="freeText" rows="9" aria-label="${esc(t('l4.p'))}"></textarea>
      <p class="hint" id="wc"></p><span class="lbl" style="margin-top:8px">${esc(t('write.vocab'))}</span><div class="vocab" id="vocab"></div>`;
  }
  A.innerHTML = h;
  if (lv === 1){
    $$('#writeArea select').forEach(sel => { sel.value = writing.l1[+sel.dataset.i] || ''; sel.addEventListener('change', () => { writing.l1[+sel.dataset.i] = sel.value; sel.className = ''; saveW(); }); });
    $('#l1Check').addEventListener('click', () => {
      let n = 0;
      $$('#writeArea select').forEach(sel => { const ok = sel.value === L1[+sel.dataset.i].ans; if (ok) n++; sel.className = sel.value ? (ok ? 'ok' : 'bad') : ''; });
      logEvent({event:'check', station:'write-level-1', stageIndex:L1.length, correct:n === L1.length, stars:n});
      $('#l1Res').className = 'status ' + (n === L1.length ? 'ok-msg' : ''); $('#l1Res').textContent = t('write.score',{n, t:L1.length});
    });
  } else if (lv === 2 || lv === 3){
    const key = lv === 2 ? 'l2' : 'l3';
    $$('#writeArea [data-i]').forEach(el => { el.value = writing[key][+el.dataset.i] || ''; el.addEventListener('input', () => { writing[key][+el.dataset.i] = el.value; saveW(); }); });
  } else {
    const ta = $('#freeText'); ta.value = writing.l4;
    const upd = () => {
      const words = ta.value.trim().split(/\s+/).filter(Boolean).length;
      $('#wc').textContent = t('write.words',{n:words});
      $('#vocab').innerHTML = VOCAB.map(([n,re]) => `<span class="${re.test(ta.value)?'on':''}">${esc(n)}</span>`).join('');
    };
    ta.addEventListener('input', () => { writing.l4 = ta.value; saveW(); upd(); }); upd();
  }
}
function writingText(){
  const lv = writing.level, blank = '_____';
  let lines = [];
  if (lv === 1) L1.forEach((s,i) => lines.push(s.pre + (writing.l1[i] ? WORDS[writing.l1[i]][0] : blank) + s.post));
  else if (lv === 2) L2.forEach((f,i) => lines.push(f[0] + ' ' + (writing.l2[i] || blank)));
  else if (lv === 3) L3.forEach((f,i) => lines.push(f[0] + ' ' + (writing.l3[i] || blank)));
  else lines.push(writing.l4);
  return lines.join(lv === 4 ? '\n' : '\n');
}
function fullText(){
  const head = [t('write.title')]; if (writing.name) head.push(writing.name);
  let out = head.join('\n') + '\n\n' + writingText();
  const caps = snaps.map(s => s.cap).filter(Boolean);
  if (caps.length) out += '\n\n' + caps.map((c,i) => `[${i+1}] ${c}`).join('\n');
  return out;
}
function copyText(txt){
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt);
  return new Promise(res => { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch(e){} ta.remove(); res(); });
}
function logWriting(action){
  const txt = writingText();
  logEvent({event:'writing-' + action, station:'write-level-' + writing.level, stageIndex:writing.level, text:txt, wordCount:txt.replace(/_+/g,' ').trim().split(/\s+/).filter(Boolean).length});
}
function bindWrite(){
  $('#wName').addEventListener('input', e => { writing.name = e.target.value; $('#gName').value = e.target.value; saveW(); });
  $('#gName').addEventListener('input', e => { writing.name = e.target.value; $('#wName').value = e.target.value; saveW(); });
  $('#gPeriod').addEventListener('input', e => { writing.period = e.target.value; saveW(); });
  $('#wCopy').addEventListener('click', () => { logWriting('copy'); copyText(fullText()).then(() => toast(t('write.copied'))).catch(() => {}); });
  $('#wDown').addEventListener('click', () => {
    logWriting('download');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([fullText()], {type:'text/plain'}));
    a.download = 'shape-lab-writing.txt'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $('#wPrint').addEventListener('click', () => {
    logWriting('print');
    const ps = $('#printSheet');
    ps.innerHTML = `<h1>${esc(t('write.title'))}</h1><p><b>${esc(writing.name)}</b> &nbsp; ${esc(new Date().toLocaleDateString())}</p>
      ${snaps.length ? `<div class="ps-snaps">${snaps.map(s => `<figure style="margin:0"><img src="${s.src}" alt=""><figcaption>${esc(s.cap)}</figcaption></figure>`).join('')}</div>` : ''}
      <p>${esc(writingText())}</p>`;
    window.print();
  });
  $('#wClear').addEventListener('click', () => {
    Object.assign(writing, {name:'', l1:Array(L1.length).fill(''), l2:Array(L2.length).fill(''), l3:Array(L3.length).fill(''), l4:''});
    snaps.length = 0; saveW(); $('#wName').value = ''; $('#gName').value = ''; hasLoggedStart = false; renderWrite(); renderSnaps(); toast(t('write.cleared'));
  });
}
function renderRecap(){ renderDisc(); renderIdeas(); renderSnaps(); renderLevels(); renderWrite(); $('#wName').value = writing.name; }

function renderWall(){
  $('#wallList').innerHTML = WALL.map(w => `<div><dt>${esc(w[0])} <em>/ ${esc(w[1])}</em></dt><dd>${esc(w[2])}</dd><dd class="es" lang="es">${esc(w[3])}</dd></div>`).join('');
}

/* ============================================================
   App shell
   ============================================================ */
let current = 'twins';
function applyLang(){
  document.documentElement.lang = lang;
  document.title = t('app.title');
  $$('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $$('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  $$('#langSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  if (lab.mode === 'missions') renderMission();
  renderWall(); drawTwins(); drawLab();
  if (current === 'sort') renderSort();
  if (current === 'recap') renderRecap();
}
function showTab(id){
  current = id;
  $$('[role=tab]').forEach(b => { const on = b.dataset.tab === id; b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; });
  $$('main > section').forEach(s => s.hidden = s.id !== 'tab-' + id);
  requestAnimationFrame(() => {
    if (id === 'twins') drawTwins();
    if (id === 'move') drawLab();
    if (id === 'sort') renderSort();
    if (id === 'recap') renderRecap();
  });
}
function init(){
  loadW();
  $$('#langSeg button').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; applyLang(); }));
  const tabs = $$('[role=tab]');
  tabs.forEach((b,i) => {
    b.addEventListener('click', () => showTab(b.dataset.tab));
    b.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
        const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length]; n.focus(); showTab(n.dataset.tab);
      }
    });
  });
  $('#gName').value = writing.name || ''; $('#gPeriod').value = writing.period || '';
  bindTwins(); bindLab(); bindWrite(); startSort();
  if (window.ResizeObserver){
    const ro = new ResizeObserver(() => { if (current === 'twins') drawTwins(); if (current === 'move') drawLab(); });
    ro.observe($('#twinCanvas')); ro.observe($('#labCanvas'));
  }
  setTool('slide');
  applyLang();
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawTwins(); drawLab(); });
init();
})();
</script>
</body>
